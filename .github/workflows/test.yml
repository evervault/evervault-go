---
name: Test SDK
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    strategy:
      matrix:
        go: ['1.24', '1.25', '1.26.10', '1.27.3']
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: lint
    runs-on: ${{ matrix.os }}
    env:
      # testing/synctest is only available behind this experiment on Go 1.24
      GOEXPERIMENT: ${{ matrix.go == '1.24' && 'synctest' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args: --timeout=5m
      - name: Test
        env:
          EV_APP_UUID: ${{ secrets.EV_APP_UUID }}
          EV_API_KEY: ${{ secrets.EV_API_KEY }}
          EV_ENCLAVE_API_KEY: ${{ secrets.EV_ENCLAVE_API_KEY }}
          EV_SYNTHETIC_ENDPOINT_URL: ${{ secrets.EV_SYNTHETIC_ENDPOINT_URL }}
        run: go test -v -count=1 -race --short ./... 
